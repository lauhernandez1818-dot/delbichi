    <meta property="og:description" content="El mayor inventario de cauchos y repuestos para motos en Venezuela. Venta exclusiva al mayor." />

    <title>Delbichi Motors — Cauchos y Repuestos para Motos</title>
    <style>
      #page-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0b;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #page-loader img {
        width: min(92vw, 720px);
        height: auto;
        object-fit: contain;
      }
      #page-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="page-loader" aria-hidden="true">
      <img src="/images/logo.webp" alt="Delbichi Motors" />
    </div>
    <div id="root"></div>
    <script>
      (function () {
        function hideLoader() {
          var loader = document.getElementById('page-loader');
          if (!loader || loader.classList.contains('is-hidden')) return;
          loader.classList.add('is-hidden');
          window.setTimeout(function () {
            loader.remove();
          }, 600);
        }

        window.addEventListener('error', hideLoader);
        window.setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) hideLoader();
        }, 4000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
